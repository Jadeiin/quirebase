repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^src/quirebase/static/vendor/.*\.mjs$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=10000]
      - id: check-case-conflict
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
        files: ^(uv\.lock|pyproject\.toml|uv\.toml|packages/[^/]+/pyproject\.toml)$
        args: [--index, https://pypi.org/simple, --refresh]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: import-linter
        name: architecture import contracts
        entry: uv run --frozen lint-imports
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|src/.*\.py|packages/[^/]+/src/.*\.py)$
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy src/quirebase
        language: system
        pass_filenames: false
      - id: pytest-fast
        name: pytest fast suite
        entry: uv run --frozen pytest -q -m "not oa" -n 4 --dist loadscope
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
