name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
jobs:
  sqlite:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: uv sync
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: uv run prek run --all-files
      - run: uv run mypy src/quirebase
      - run: uv run pytest -q -m "not oa"
      - run: uv run quirebase init-db
      - run: uv run quirebase doctor
      - run: uv build --all-packages --no-sources
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quirebase_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUIREBASE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/quirebase_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra postgres
      - run: uv run pytest -q tests/test_postgres_contract.py
  s3-object-store:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: quirebase
      AWS_SECRET_ACCESS_KEY: quirebase-secret
      QUIREBASE_TEST_S3_ENDPOINT: http://localhost:9000
      QUIREBASE_TEST_S3_BUCKET: quirebase-contract
      QUIREBASE_TEST_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: docker run --detach --name quirebase-minio --publish 9000:9000 --env MINIO_ROOT_USER=quirebase --env MINIO_ROOT_PASSWORD=quirebase-secret minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
      - run: curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://localhost:9000/minio/health/live
      - run: docker run --rm --network host minio/mc alias set local http://localhost:9000 quirebase quirebase-secret
      - run: docker run --rm --network host minio/mc mb --ignore-existing local/quirebase-contract
      - run: uv run pytest -q tests/test_storage.py
      - run: uv run pytest -q tests/test_library_bulk_permissions.py::test_streaming_bundle_cancellation_releases_object_stream
  oa-pdf-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - uses: actions/cache@v4
        with:
          path: .cache/oa-pdfs
          key: oa-pdfs-${{ hashFiles('tests/oa_corpus.json') }}
      - run: uv sync
      - run: bun install --frozen-lockfile
      - run: uv run python scripts/download-oa-corpus.py
      - run: uv run pytest -q -m oa
      - run: bun run test:oa:pdfjs
      - run: uv run python scripts/check-metadata-providers.py
