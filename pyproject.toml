[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quirebase"
version = "0.1.3"
description = "A collaborative, self-hosted research library"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "fastapi>=0.116,<1",
  "inquiro==0.1.3",
  "jinja2>=3.1,<4",
  "pymupdf>=1.28,<1.29",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rubrica==0.1.3",
  "sqlalchemy[asyncio,aiosqlite]>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "babel>=2.18.0",
  "tzdata>=2025.2; sys_platform == 'win32'",
  "tzlocal>=5.3,<6",
  "mcp>=2.1,<3",
  "obstore>=0.11.1,<0.12",
  "stream-zip>=0.0.84,<0.1",
  "dbos>=2.31.0,<3",
]

[project.optional-dependencies]
postgres = [
  "sqlalchemy[postgresql-psycopgbinary,postgresql-asyncpg]>=2.0,<3",
]
citation = ["inquiro[citation]==0.1.3"]
keybert = ["rubrica[keybert]==0.1.3"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
inquiro = { workspace = true }
rubrica = { workspace = true }

[dependency-groups]
dev = [
  "commitizen>=4.17,<5",
  "citeproc-py>=0.10,<0.11",
  "citeproc-py-styles>=0.1.6,<0.2",
  "mypy>=1.17,<2",
  "prek>=0.3,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.16,<1",
]

[project.scripts]
quirebase = "quirebase.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quirebase"]
artifacts = ["src/quirebase/static"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "quirebase/migrations"
"docs" = "quirebase/docs"
"THIRD_PARTY.md" = "quirebase/THIRD_PARTY.md"

[tool.hatch.build.targets.sdist]
artifacts = ["src/quirebase/static"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/inquiro/tests", "packages/rubrica/tests"]
markers = ["oa: tests using the separately downloaded open-access PDF corpus"]

[tool.ruff]
line-length = 100
target-version = "py312"
preview = true

[tool.ruff.lint]
extend-select = [
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "FA",    # flake8-future-annotations
  "I",     # isort
  "N",     # pep8-naming
  "PERF",  # perflint
  "PIE",   # flake8-pie
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RUF",   # Ruff-specific correctness rules
  "SIM",   # flake8-simplify
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
ignore = [
  "function-call-in-default-argument", # FastAPI deliberately calls Depends/Form/File in signatures
  "blind-except",                      # worker boundary must record arbitrary task failures
  "error-suffix-on-exception-name",    # domain exceptions follow ubiquitous language without Error suffix
]
future-annotations = true
exclude = ["migrations"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["print"]
"tests/**" = ["import-private-name", "assert"]
"packages/*/tests/**" = ["import-private-name", "assert"]
"src/quirebase/web/**" = ["typing-only-first-party-import"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = [
  "citeproc",
  "citeproc.*",
  "citeproc_styles",
  "keybert",
  "keybert.*",
  "model2vec",
  "model2vec.*",
  "rispy",
  "yake",
  "yake.*",
]
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
version_files = [
  "pyproject.toml",
  "packages/inquiro/pyproject.toml",
  "packages/rubrica/pyproject.toml",
  "src/quirebase/__init__.py",
]
