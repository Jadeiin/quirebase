[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quirebase"
version = "0.1.0"
description = "A collaborative, self-hosted research library"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "bibtexparser>=1.4,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pymupdf>=1.28,<1.29",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rispy>=0.10,<1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "commitizen>=4.17,<5",
  "mypy>=1.17,<2",
  "prek>=0.3,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.16,<1",
]

[project.scripts]
quirebase = "quirebase.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quirebase"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "quirebase/migrations"
"docs" = "quirebase/docs"
"THIRD_PARTY.md" = "quirebase/THIRD_PARTY.md"
"SOURCE_POLICY.md" = "quirebase/SOURCE_POLICY.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["oa: tests using the separately downloaded open-access PDF corpus"]

[tool.ruff]
line-length = 100
target-version = "py312"
preview = true

[tool.ruff.lint]
extend-select = [
  "C4",   # flake8-comprehensions
  "FA",   # flake8-future-annotations
  "I",    # isort
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RUF",  # Ruff-specific correctness rules
  "SIM",  # flake8-simplify
  "TC",   # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "function-call-in-default-argument", # FastAPI deliberately calls Depends/Form/File in signatures
  "blind-except",                      # worker boundary must record arbitrary task failures
]
future-annotations = true
exclude = ["migrations"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["print"]
"tests/**" = ["import-private-name", "assert"]
"src/quirebase/app.py" = ["typing-only-first-party-import"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["bibtexparser", "bibtexparser.*", "rispy"]
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
major_version_zero = true
