[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quirebase"
version = "0.1.4"
description = "A collaborative, self-hosted research library"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "advanced-alchemy[argon2,obstore,uuid]==1.11.0",
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "casbin>=1.43,<2",
  "fastapi>=0.141.1,<1",
  "httpx2>=2.12,<3",
  "inquiro==0.1.4",
  "pymupdf>=1.28,<1.29",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rubrica==0.1.4",
  "sqlalchemy[asyncio,aiosqlite]>=2.0,<2.1",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "tzdata>=2025.2; sys_platform == 'win32'",
  "tzlocal>=5.3,<6",
  "fastmcp>=4,<5",
  "obstore>=0.11.1,<0.12",
  "stream-zip>=0.0.84,<0.1",
  "dbos>=2.31.0,<3",
]

[project.optional-dependencies]
postgres = [
  "sqlalchemy[postgresql-psycopgbinary]>=2.0,<2.1",
]
citation = ["inquiro[citation]==0.1.4"]
keybert = ["rubrica[keybert]==0.1.4"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
inquiro = { workspace = true }
rubrica = { workspace = true }

[dependency-groups]
dev = [
  "commitizen>=4.17,<5",
  "citeproc-py>=0.10,<0.11",
  "citeproc-py-styles>=0.1.6,<0.2",
  "mypy>=1.17,<2",
  "prek>=0.3,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.16,<1",
  "import-linter[ui]>=2.15,<3.0",
]

[project.scripts]
quirebase = "quirebase.cli:app"

[tool.alembic]
# Configured through the Alembic pyproject template; see
# https://alembic.sqlalchemy.org/en/latest/tutorial.html
script_location = "%(here)s/migrations"
prepend_sys_path = [
    ".",
]
# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# file_template = "%%(rev)s_%%(slug)s"
# timezone =
# truncate_slug_length = 40
# revision_environment = false
# recursive_version_locations = false
# output_encoding = "utf-8"
# version_locations = [
#     "%(here)s/migrations/versions",
# ]

[tool.hatch.build.targets.wheel]
packages = ["src/quirebase"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "quirebase/migrations"
"docs" = "quirebase/docs"
"THIRD_PARTY.md" = "quirebase/THIRD_PARTY.md"

[tool.hatch.build.targets.sdist]
artifacts = ["frontend/build"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/inquiro/tests", "packages/rubrica/tests"]
markers = [
  "oa: tests using the separately downloaded open-access PDF corpus",
  "shared_postgres: tests that mutate the configured shared PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
preview = true
exclude = ["migrations/versions"]
force-exclude = true

[tool.ruff.lint]
extend-select = [
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "FA",    # flake8-future-annotations
  "I",     # isort
  "N",     # pep8-naming
  "PERF",  # perflint
  "PIE",   # flake8-pie
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RUF",   # Ruff-specific correctness rules
  "SIM",   # flake8-simplify
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
ignore = [
  "function-call-in-default-argument", # FastAPI deliberately calls Depends/Form/File in signatures
  "blind-except",                      # worker boundary must record arbitrary task failures
  "error-suffix-on-exception-name",    # domain exceptions follow ubiquitous language without Error suffix
]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["print"]
"tests/**" = ["import-private-name", "assert"]
"packages/*/tests/**" = ["import-private-name", "assert"]
"src/quirebase/web/**" = ["typing-only-first-party-import", "typing-only-standard-library-import"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = [
  "casbin",
  "citeproc",
  "citeproc.*",
  "citeproc_styles",
  "keybert",
  "keybert.*",
  "model2vec",
  "model2vec.*",
  "rispy",
  "yake",
  "yake.*",
]
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
version_files = [
  "pyproject.toml",
  "packages/inquiro/pyproject.toml",
  "packages/rubrica/pyproject.toml",
  "src/quirebase/__init__.py",
]

# Import boundaries follow docs/architecture/modules.md. Protected contracts check
# direct imports; legal indirect business dependencies remain allowed.
[tool.importlinter]
root_packages = ["quirebase", "inquiro", "rubrica"]
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "module-access"
name = "Access has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.access"]
allowed_importers = [
  "quirebase.accounts",
  "quirebase.audit",
  "quirebase.documents",
  "quirebase.library",
  "quirebase.operations",
  "quirebase.projects",
  "quirebase.web",
  "quirebase.workspaces",
]

[[tool.importlinter.contracts]]
id = "module-accounts"
name = "Accounts has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.accounts"]
allowed_importers = ["quirebase.cli", "quirebase.mcp", "quirebase.web"]

[[tool.importlinter.contracts]]
id = "module-audit"
name = "Audit has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.audit"]
allowed_importers = [
  "quirebase.accounts",
  "quirebase.documents",
  "quirebase.library",
  "quirebase.mcp",
  "quirebase.operations",
  "quirebase.projects",
  "quirebase.web",
  "quirebase.workspaces",
]

[[tool.importlinter.contracts]]
id = "module-core"
name = "Core has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.core"]
allowed_importers = [
  "quirebase.access",
  "quirebase.accounts",
  "quirebase.audit",
  "quirebase.cli",
  "quirebase.documents",
  "quirebase.library",
  "quirebase.mcp",
  "quirebase.models",
  "quirebase.operations",
  "quirebase.projects",
  "quirebase.web",
  "quirebase.workspaces",
]

[[tool.importlinter.contracts]]
id = "module-documents"
name = "Documents has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.documents"]
allowed_importers = [
  "quirebase.cli",
  "quirebase.library",
  "quirebase.projects",
  "quirebase.web",
  "quirebase.workspaces",
]

[[tool.importlinter.contracts]]
id = "module-library"
name = "Library has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.library"]
allowed_importers = ["quirebase.cli", "quirebase.operations", "quirebase.web"]

[[tool.importlinter.contracts]]
id = "module-mcp"
name = "Mcp has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.mcp"]
allowed_importers = ["quirebase.web"]

[[tool.importlinter.contracts]]
id = "module-operations"
name = "Operations has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.operations"]
allowed_importers = [
  "quirebase.accounts",
  "quirebase.cli",
  "quirebase.documents",
  "quirebase.library",
  "quirebase.web",
  "quirebase.workspaces",
]

[[tool.importlinter.contracts]]
id = "module-projects"
name = "Projects has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.projects"]
allowed_importers = ["quirebase.cli", "quirebase.library", "quirebase.web"]

[[tool.importlinter.contracts]]
id = "module-search"
name = "Search has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.search"]
allowed_importers = [
  "quirebase.cli",
  "quirebase.documents",
  "quirebase.library",
  "quirebase.operations",
  "quirebase.web",
]

[[tool.importlinter.contracts]]
id = "module-web"
name = "Web has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.web"]
allowed_importers = []

[[tool.importlinter.contracts]]
id = "module-workspaces"
name = "Workspaces has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.workspaces"]
allowed_importers = ["quirebase.accounts", "quirebase.cli", "quirebase.web"]

[[tool.importlinter.contracts]]
id = "module-models"
name = "Models has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.models"]
allowed_importers = [
  "quirebase.access",
  "quirebase.accounts",
  "quirebase.audit",
  "quirebase.cli",
  "quirebase.documents",
  "quirebase.library",
  "quirebase.operations",
  "quirebase.projects",
  "quirebase.search",
  "quirebase.web",
  "quirebase.workspaces",
]

[[tool.importlinter.contracts]]
id = "module-cli"
name = "Cli has only documented direct callers"
type = "protected"
protected_modules = ["quirebase.cli"]
allowed_importers = []

[[tool.importlinter.contracts]]
id = "business-transport"
name = "Business Modules do not import transport frameworks or vendor AI SDKs"
type = "forbidden"
source_modules = [
  "quirebase.access",
  "quirebase.accounts",
  "quirebase.audit",
  "quirebase.documents",
  "quirebase.library",
  "quirebase.operations",
  "quirebase.projects",
  "quirebase.workspaces",
]
forbidden_modules = ["fastapi", "mcp", "pydantic_ai", "quirebase.web"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "obstore-owner"
name = "Only Core storage imports obstore"
type = "protected"
protected_modules = ["obstore"]
allowed_importers = ["quirebase.core.storage"]

[[tool.importlinter.contracts]]
id = "inquiro-callers"
name = "Inquiro has only documented application callers"
type = "protected"
protected_modules = ["inquiro"]
allowed_importers = ["quirebase.documents", "quirebase.library", "quirebase.search"]

[[tool.importlinter.contracts]]
id = "rubrica-callers"
name = "Only Library adapts Rubrica"
type = "protected"
protected_modules = ["rubrica"]
allowed_importers = ["quirebase.library"]

[[tool.importlinter.contracts]]
id = "standalone-packages"
name = "Standalone packages do not depend on Quirebase or its ORM"
type = "forbidden"
source_modules = ["inquiro", "rubrica"]
forbidden_modules = ["quirebase", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "inquiro-richtext-callers"
name = "Non-Library Inquiro callers use only Rich Text"
type = "protected"
protected_modules = ["inquiro.*"]
allowed_importers = ["inquiro", "quirebase.library"]
# Rich Text is the neutral interface shared with Documents and Search. The root
# Inquiro contract still restricts which application Modules may use it.
ignore_imports = ["quirebase.** -> inquiro.richtext"]

[[tool.importlinter.contracts]]
id = "inquiro-provider-facade"
name = "Documents and Search do not import the Inquiro Provider facade"
type = "forbidden"
source_modules = [
  "quirebase.documents",
  "quirebase.documents.**",
  "quirebase.search",
  "quirebase.search.**",
]
forbidden_modules = ["inquiro"]
as_packages = false
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "library-facade"
name = "Library callers use its facade; CLI registers owned workflows"
type = "protected"
protected_modules = ["quirebase.library.*"]
allowed_importers = ["quirebase.library", "quirebase.cli"]

[[tool.importlinter.contracts]]
id = "bibliography-facade"
name = "Bibliography callers use its facade"
type = "protected"
protected_modules = ["inquiro.bibliography.*"]
allowed_importers = ["inquiro.bibliography"]

[[tool.importlinter.contracts]]
id = "bibliography-layers"
name = "Bibliography implementation layers stay acyclic"
type = "layers"
containers = ["inquiro.bibliography"]
layers = ["engine", "formats : styles", "keys", "records : options"]
exhaustive = true

[[tool.importlinter.contracts]]
id = "provider-layers"
name = "Providers are independent leaves below their private catalog"
type = "layers"
containers = ["inquiro.providers"]
layers = [
  "_catalog",
  "arxiv | crossref | datacite | ieee | nasa_ads | openalex | openlibrary | pmc | pubmed",
  "_contracts : _payload",
]
exhaustive = true

[[tool.importlinter.contracts]]
id = "provider-runtime"
name = "Provider implementations do not depend on the runtime"
type = "forbidden"
source_modules = ["inquiro.providers"]
forbidden_modules = ["inquiro.runtime"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "search-adapters"
name = "Search adapters are independent"
type = "independence"
modules = ["quirebase.search.sqlite", "quirebase.search.postgres"]

[[tool.importlinter.contracts]]
id = "bulk-downloads"
name = "Multi-Item downloads cross the Library bulk interface"
type = "forbidden"
source_modules = ["quirebase.web.api.library_exports"]
forbidden_modules = ["quirebase.documents"]
allow_indirect_imports = true
