# Quirebase supplies canonical, database-loaded facts. Casbin is the sole policy evaluator.
[request_definition]
r = subject, resource, action, lifecycle, relation

[policy_definition]
p = subject, resource, action, lifecycle, relation

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.subject, p.subject) && r.resource == p.resource && r.action == p.action && regexMatch(r.lifecycle, "^(" + p.lifecycle + ")$") && regexMatch(r.relation, "^(" + p.relation + ")$")
