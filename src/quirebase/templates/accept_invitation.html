{% extends "base.html" %}{% block content %}<section class="panel narrow"><h1>Accept invitation</h1>
{% if invitation %}<p>Create account <strong>{{ invitation.username }}</strong>.</p><form method="post"><input type="password" name="password" minlength="12" required><button>Create account</button></form>
