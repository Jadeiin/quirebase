{% extends "base.html" %}{% block content %}<section class="panel"><h1>{{ t('Active sessions') }}</h1>{% for session in sessions %}<p>{{ session.created_at }} · {{ t('expires {time}', time=session.expires_at) }}{% if session.id == login.id %} · {{ t('current') }}{% else %}<form class="inline" method="post" action="/account/sessions/{{ session.id }}/revoke?csrf_token={{ csrf }}"><button>{{ t('Revoke') }}</button></form>{% endif %}</p>{% endfor %}
<form method="post" action="/account/sessions/revoke-all?csrf_token={{ csrf }}"><button>{{ t('Sign out of all sessions') }}</button></form></section>{% endblock %}
