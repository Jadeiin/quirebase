{% extends "base.html" %}
{% block title %}{{ _('Sign in') }} · Quirebase{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>{{ _('Sign in') }}</h1>
  {% if error %}<p class="error">{{ _(error) }}</p>{% endif %}
  <form method="post">
    <label>{{ _('Username') }}<input name="username" autocomplete="username" required></label>
    <label>{{ _('Password') }}<input name="password" type="password" autocomplete="current-password" required></label>
    <button>{{ _('Sign in') }}</button>
  </form>
</section>
{% endblock %}
