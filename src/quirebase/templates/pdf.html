{% extends "base.html" %}
{% block title %}{{ item.title }} · Quirebase{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', path='/vendor/pdf_viewer.css') }}">{% endblock %}
{% block content %}
<div id="pdf-app" data-item-id="{{ item.id }}" data-revision-id="{{ revision.id }}" data-csrf="{{ csrf }}">
  <nav class="pdf-tools">
    <button data-color="yellow">Yellow</button><button data-color="green">Green</button>
    <button data-color="blue">Blue</button><button data-color="red">Red</button>
    <button id="add-note">Note</button><button id="delete-annotation">Delete selected</button>
    <select id="annotation-project"><option value="">Private</option>{% for project in projects %}<option value="{{ project.id }}">{{ project.name }}</option>{% endfor %}</select>
    <button id="export-annotations">Export</button>
    <span id="pdf-status">Loading…</span>
  </nav>
  <div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>
</div>
<script type="module" src="{{ url_for('static', path='/pdf_viewer.js') }}"></script>
{% endblock %}
