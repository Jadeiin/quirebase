[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inquiro"
version = "0.1.3"
description = "Academic metadata discovery, multi-provider search, bibliography interchange and CSL citation engine"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "bibtexparser>=2.0.0b9,<3",
  "httpx2>=2.12,<3",
  "latex2mathml>=3.81,<4",
  "pylatexenc>=2.11,<3",
  "rispy>=0.10,<1",
]

[project.scripts]
inquiro = "inquiro.cli:main"

[project.optional-dependencies]
citation = [
  "citeproc-py>=0.10,<0.11",
  "citeproc-py-styles>=0.1.6,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inquiro"]
