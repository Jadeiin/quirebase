[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inquiro"
version = "0.1.4"
description = "Academic metadata discovery, multi-provider search, bibliography interchange and CSL citation engine"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "commonmeta-py==0.309",
  "commonmeta-schema==1.0.1",
  "pydantic>=2.12,<3",
  "jsonschema-rs>=0.58.6,<0.59",
  "citeproc-py>=0.10,<0.11",
  "httpx2[socks]>=2.12,<3",
  "pylatexenc>=2.10,<3",
  "python-dateutil>=2.9,<3",
]

[project.scripts]
inquiro = "inquiro.cli:main"

[project.optional-dependencies]
citation = [
  "citeproc-py-styles>=0.1.6,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inquiro"]
