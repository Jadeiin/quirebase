[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rubrica"
version = "0.1.3"
description = "Keyword extraction, keyphrase ranking and tag recommendation engine"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "yake>=0.7,<0.8",
]

[project.optional-dependencies]
keybert = [
  "keybert>=0.9,<0.10",
  "model2vec>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rubrica"]
