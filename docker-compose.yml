# Quirebase deployment: PostgreSQL + web + worker.
#
#   make docker-env      # creates .env.docker with a generated POSTGRES_PASSWORD
#   make docker-up       # or: docker compose --env-file .env.docker up --detach
#   make docker-admin    # creates the first administrator
#
# Terminate TLS in a reverse proxy in front of the published port, then set
# QUIREBASE_ALLOWED_HOSTS to the public hostname and QUIREBASE_SECURE_COOKIES=true.
# Immutable objects stay on the shared local volume unless QUIREBASE_OBJECT_STORE=s3,
# QUIREBASE_S3_* and AWS_* are set in .env.docker.

name: quirebase

x-quirebase: &quirebase
  image: ghcr.io/jadeiin/quirebase:${QUIREBASE_IMAGE_TAG:-latest}
  build:
    context: .
  restart: unless-stopped
  init: true
  env_file:
    - path: ${DOCKER_ENV:-.env.docker}
      required: false
  environment:
    QUIREBASE_DATABASE_URL: postgresql+psycopg://quirebase:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}@postgres:5432/quirebase
    QUIREBASE_DATA_DIR: /data
    QUIREBASE_ALLOWED_HOSTS: ${QUIREBASE_ALLOWED_HOSTS:-localhost,127.0.0.1}
    QUIREBASE_SECURE_COOKIES: ${QUIREBASE_SECURE_COOKIES:-false}
  volumes:
    - quirebase-data:/data

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quirebase
      POSTGRES_USER: quirebase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
    volumes:
      # PostgreSQL 18+ keeps PGDATA at /var/lib/postgresql/18/docker, so the volume
      # targets its parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Force TCP so the check cannot pass against the entrypoint's initialization
      # server, which only listens on the unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U quirebase -d quirebase"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *quirebase
    restart: "no"
    command: ["quirebase", "init-db"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *quirebase
    command: ["quirebase", "serve", "--host", "0.0.0.0", "--port", "9060"]
    ports:
      - "${QUIREBASE_PORT:-9060}:9060"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9060/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s

  worker:
    <<: *quirebase
    # Every replica derives a distinct executor ID from its container hostname, so the
    # service can be scaled. Pin QUIREBASE_WORKFLOW_EXECUTOR_ID in .env.docker to a
    # stable value to let a single worker resume its own workflows after a restart.
    command:
      - sh
      - -c
      - >-
        export QUIREBASE_WORKFLOW_EXECUTOR_ID="$${QUIREBASE_WORKFLOW_EXECUTOR_ID:-quirebase-worker-$${HOSTNAME}}";
        exec quirebase worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s

volumes:
  quirebase-data:
  postgres-data:
